name: 打包iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm install

      - name: 添加iOS平台
        run: npx cap add ios

      - name: 同步项目
        run: npx cap sync

      - name: 安装CocoaPods依赖
        run: |
          cd ios/App
          pod install

      - name: 构建IPA
        run: |
          xcodebuild archive \
            -scheme App \
            -workspace ios/App/App.xcworkspace \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: 上传IPA文件
        uses: actions/upload-artifact@v4
        with:
          name: 库存管理.ipa
          path: build/ipa/*.ipa
